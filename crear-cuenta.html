</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
    <div class="container py-2">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <span class="brand-mark"><i class="bi bi-controller"></i></span>JuegaYa
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto me-lg-3 gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="iniciar-sesion.html">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link active" href="crear-cuenta.html">Crear cuenta</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html#catalogo">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html#contacto">Contacto</a></li>
        </ul>
        <a class="btn btn-dark rounded-pill px-3" href="catalogo.html#catalogo"><i class="bi bi-bag me-1"></i> Mi reserva</a>
      </div>
    </div>
  </nav>

  <main>
    <!-- apartado crear perfiles-->
    <section class="py-5 bg-light border-top" id="registro">
      <div class="container py-lg-4">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 p-4">

              <!-- Formulario de registro  -->
              <form id="registroForm">
                <h2 class="h3 fw-bold mb-4 text-center">Crear Perfil</h2>

                <!--Nombre del Usuario -->
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre:</label>
                  <input type="text" class="form-control" id="nombre" required>
                </div>

                <!-- Campo Correo electrónico -->
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico:</label>
                  <input type="email" class="form-control" id="email" required>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña:</label>
                  <input type="password" class="form-control" id="password" required>
                </div>

                <!-- Botón de envío (tipo submit) para procesar el registro -->
                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 mt-2">Registrarse</button>
                <p class="text-center text-secondary small mt-3 mb-0">¿Ya tienes cuenta? <a href="iniciar-sesion.html">Inicia sesión</a></p>
              </form>

            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="py-4" id="contacto"><div class="container d-flex justify-content-between align-items-center gap-3"><a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="index.html"><span class="brand-mark"><i class="bi bi-controller"></i></span>JuegaYa</a><div class="d-flex gap-3"><a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a><a href="#" aria-label="WhatsApp"><i class="bi bi-whatsapp"></i></a></div></div></footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast" role="status" aria-live="polite" aria-atomic="true"><div class="toast-body d-flex align-items-center gap-2"><i class="bi bi-check-circle-fill text-success"></i><span id="toastMensaje">Aviso</span></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
